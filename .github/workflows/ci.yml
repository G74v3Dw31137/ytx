name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: 'off'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Test
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: Build without CGO
        run: CGO_ENABLED=0 go build ./...

      - name: Coverage
        run: go test -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

      - name: Upload coverage
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  pages:
    name: Publish coverage
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Generate badge
        run: |
          mkdir -p public

          COVERAGE=$(go tool cover -func=coverage/coverage.out | awk '$1 == "total:" {print $3}')
          if [ -z "$COVERAGE" ]; then
            echo "::error::Failed to extract coverage percentage"
            exit 1
          fi
          VALUE="${COVERAGE%\%}"

          COLOR="red"
          if awk "BEGIN {exit !($VALUE >= 80)}"; then
            COLOR="brightgreen"
          elif awk "BEGIN {exit !($VALUE >= 50)}"; then
            COLOR="yellow"
          fi

          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"%s"}\n' \
            "$COVERAGE" "$COLOR" > public/coverage.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
